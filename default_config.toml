[hotkeys]
hint-mode = "alt-cmd-shift-/"
hint-mode-right-click = "alt-cmd-shift-space"
hint-mode-copy-link = "cmd-shift-l"
text-select = "cmd-shift-y"
scroll-mode = "cmd-shift-i"
menu-search = "alt-cmd-shift-p"
pluck = "alt-cmd-shift-o"
warp = "alt-cmd-shift-h"
focus-window = "alt-cmd-shift-z"
apply-scene = "alt-ctrl-{n}"

terminal = "Ghostty"

[ignore]
apps = ["Raycast", "Spotlight", "Alfred", "1Password"]

[border]
enabled = true
active-color = "0xffe1e3e4"
inactive-color = "0xff494d64"
width = 5.0
corner-radius = 10.0

# App shortcuts: hotkey -> app name. Pressing the hotkey activates the app if it
# is already running, or launches it otherwise. The hotkey format matches the
# [hotkeys] section (modifiers joined by '-', e.g. "alt-cmd-ctrl-2").
#
# [app-shortcuts]
# "cmd-4" = "Ghostty"
# "alt-cmd-ctrl-2" = "Google Chrome"
# "alt-cmd-ctrl-3" = "Slack"
# "alt-cmd-ctrl-4" = "Google Chrome"
# "alt-cmd-shift-5" = "Linear"
# "alt-cmd-shift-6" = "Notion"
# "alt-cmd-shift-7" = "DataGrip"

[profile.default]
screen-width-min = 0

[profile.default.spaces.1]
apps = []
